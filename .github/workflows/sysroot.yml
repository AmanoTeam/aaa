name: System roots

on:
  schedule:
    - cron: '0 23 * * *'
  workflow_dispatch:
    branches:
        - '**'
  push:
    branches:
        - '**'

permissions: write-all

jobs:
  cross-build:
    name: 'Cross build'
    runs-on: ubuntu-latest
    continue-on-error: true
    strategy:
      matrix:
        crtdll: [
          'msvcrt',
          'ucrt',
        ]
        target: [
          'x86_64-w64-mingw32',
          'i686-w64-mingw32',
          'aarch64-w64-mingw32',
        ]
    steps:
    - uses: actions/checkout@main
      with:
        submodules: true
    - name: Generate system roots
      env:
        CRTDLL: ${{ matrix.crtdll }}
      run: |
        declare -r MINGW_TAG='gcc-16'
        declare -r MINGW_TARBALL='/tmp/toolchain.tar.xz'
        declare -r MINGW_URL="https://github.com/AmanoTeam/MinGW-w64/releases/download/${MINGW_TAG}/x86_64-unknown-linux-gnu.tar.xz"
        
        curl --connect-timeout '10' --retry '15' --retry-all-errors --fail --silent --location --url "${MINGW_URL}" --output "${MINGW_TARBALL}"
        tar --directory="$(dirname "${MINGW_TARBALL}")" --extract --file="${MINGW_TARBALL}"
        
        export MINGW_HOME='/tmp/mingw-gcc-cross'
        export PATH="${MINGW_HOME}/bin:${PATH}"
        
        export CMAKE_TOOLCHAIN_FILE="${MINGW_HOME}/usr/local/share/mingw/cmake/${{ matrix.target }}.cmake"
        
        source "${MINGW_HOME}/build/autotools/${{ matrix.target }}.sh"
        
        export CC=${CC/-ucrt/}
        export CC=${CC/-msvcrt/}
        
        bash './sysroot.sh'
    - name: Create logs
      if: always()
      run: |
        declare logs=''
        
        while read file; do
            logs+="${file} "
        done <<< $(find "/tmp" -wholename '*.log' -o -wholename '*.yaml')
        
        tar --create --file=- ${logs} | xz --threads='0' --compress -9 > '/tmp/logs.tar.xz'
    - name: Upload logs
      if:  always()
      uses: actions/upload-artifact@main
      with:
        name: ${{ matrix.target }}-logs
        if-no-files-found: error
        path: |
            /tmp/logs.tar.xz
    - name: Create release
      uses: softprops/action-gh-release@master
      with:
        tag_name: sysroot
        name: MinGW-w64 system roots
        files: /tmp/*-w64-*.tar.xz*
        draft: false
        prerelease: false
        fail_on_unmatched_files: true
        body: "* Initial release"
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
